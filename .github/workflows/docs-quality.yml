name: Docs quality

# Alcance deliberadamente reducido (S5): solo markdownlint + lychee.
# Vale y la cobertura de TSDoc con TypeDoc quedan documentados como pendientes
# en entregables/sesion-05/auditoria-y-revision-backlog.md — no se activan
# aquí todavía (ver esa nota para el motivo de cada uno).
#
# docs/PRD.md, docs/NOTAS-FORMADOR.md y entregables/sesion-04/ quedan fuera del
# lint a propósito: los primeros son documentos canónicos/del mentor, y los de
# sesion-04 son el "output crudo, sin pulir" que pedía el ejercicio de S4 — no se
# reformatean. El chequeo de enlaces (lychee) sí los cubre: no reformatear no
# significa dejar que apunten a archivos inexistentes.

on:
  pull_request:
    paths:
      - '**/*.md'
      - '.markdownlint.yaml'
      - '.lychee.toml'
  push:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1' # lunes 9:00 — los links externos pueden romperse sin tocar el repo

jobs:
  lint-markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v18
        with:
          globs: |
            README.md
            CLAUDE.md
            backend/README.md
            docs/README.md
            docs/adr/**/*.md
            openspec/**/*.md
            entregables/sesion-05/**/*.md

  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --config .lychee.toml
            README.md CLAUDE.md backend/README.md docs/README.md
            docs/adr/**/*.md openspec/**/*.md entregables/**/*.md
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
